  raw_cache_path: '${DRE_TASK1_RAW_CACHE_PATH}'
  v3_ledger_path: '${DRE_TASK1_V3_LEDGER_PATH}'
  output_dir: '${DRE_TASK1_OUTPUT_DIR}'
  pretrained_model_root: '${DRE_PRETRAINED_MODEL_ROOT}'
  brainbert_embedding_cache_path: '${DRE_TASK1_BRAINBERT_EMBEDDING_CACHE}'
  cbramod_embedding_cache_path: '${DRE_TASK1_CBRAMOD_EMBEDDING_CACHE}'
protocol:
