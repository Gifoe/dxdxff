[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reva-dlm-mini"
version = "0.2.0"
description = "CPU-only Mini G0/G1 audit for ReVA-DLM on Prophet GSM8K trajectories"
requires-python = ">=3.10,<3.11"
dependencies = [
  "click==8.3.1",
  "joblib==1.5.2",
  "huggingface-hub==1.5.0",
  "matplotlib==3.10.7",
  "numpy==2.2.6",
  "pandas==2.3.3",
  "pyarrow==23.0.1",
  "scikit-learn==1.7.2",
  "scipy==1.15.3",
  "torch==2.10.0",
  "transformers==5.12.0",
  "tqdm==4.70.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
